name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      # Bootstrap publish: token-based until @particle-academy/fancy-inertia
      # exists on npm and Trusted Publisher (OIDC) can be configured at
      # https://www.npmjs.com/package/@particle-academy/fancy-inertia/access
      # Drop NODE_AUTH_TOKEN once Trusted Publisher is set up.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@latest publish --provenance --access public
