name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      # OIDC publish via Trusted Publisher configured at
      # https://www.npmjs.com/package/@particle-academy/fancy-inertia/access
      # No token — id-token: write + setup-node's registry-url is all OIDC needs.
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
